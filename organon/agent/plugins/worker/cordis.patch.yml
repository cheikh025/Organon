# Organon worker plugin: the `workers` service and the `spawn_worker` tool,
# plus the starting worker preset, `mutator`.
- insert:
    - id: organon-worker
      name: '@organon/worker'

    # Worker presets hold a way of working and its tools. No agent-instructions
    # (workers never see AGENTS.md), skills, delegation, web or todo tools.
    - id: preset-mutator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mutator
        name: Mutator
        description: Organon worker that improves the program in its folder.
        order: 100
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a worker in a search for the best program for a task. Your folder holds the
                task's files, with the program to start from, and the files your first message lists,
                such as the evaluation of that program and its previous worker's report. Work only
                inside your folder. Start from the task, not from the program: read the statement,
                understand what the score rewards and how the program earns its score, and decide where
                the largest gain could come from. It may be a change within the program or a different
                approach; the program and its report are one attempt at the task, not a design you must
                keep. Measure as you work: run your versions and the starting program on the same
                inputs, and let the results decide. Leave in your folder the best version you measured
                that differs from the starting program: an unchanged program adds nothing to the
                search, while a different one, even a weaker one, can still be built on. It must be
                complete, valid for the task, and measured. When you finish, end with a message of at
                most 10 lines: what you changed and why, the starting program's and your program's
                results on the same inputs, what you tried that did not work, and what you would try
                next.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          # job_output / job_kill: the shell tool moves commands that outlive
          # their timeout into background jobs, which these tools read and stop.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
