# Organon worker plugin: the `workers` service and the `spawn_worker` tool,
# plus the starting worker preset, `mutator`.
- insert:
    - id: organon-worker
      name: '@organon/worker'
      # `models`: the model each worker preset runs on, by preset id, e.g.
      #   mutator: { provider: deepseek-official, model: deepseek-v4-pro, reasoningEffort: high }
      # A preset not listed runs on the main agent's model. Change it between chunks,
      # then reload this bundle (plugin_manager set_bundle @organon/worker enabled: true);
      # the reload stops any worker still running.
      config:
        models: {}

    # Worker presets hold a way of working and its tools. No agent-instructions
    # (workers never see AGENTS.md), skills, delegation, web or todo tools.
    - id: preset-mutator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mutator
        name: Mutator
        description: Organon worker that improves the program in its folder.
        order: 100
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are an expert algorithm engineer working on one attempt in a search for the best
                program for a task. Your folder holds the task's files, with the program to start from,
                and the files your first message lists, such as the evaluation of that program and its
                previous worker's report. Work only inside your folder.

                Aim for a clearly better program, not a marginal one. Large gains come from a better
                model of the problem: a new construction, representation, algorithm or search, or a
                much faster core that lets the same idea search far more. Tuning constants of an
                existing design rarely moves the result; do it only when the design itself is already
                strong, and never as your whole attempt.

                Start from the task, not from the program. Read the statement in full, work out what
                the score rewards and what makes the problem hard, then study how the starting program
                earns its score and where it loses the most. Before writing code, consider several
                genuinely different ways to do better, and choose the one with the largest expected
                gain. The program and its report are one attempt at the task, not a design you must
                keep; replacing it entirely is fine when you have a better idea.

                Spend your effort on ideas and implementation, not on measurement. While developing,
                check on a few inputs; measure on the full set of the task's inputs once you have a
                version worth keeping, and compare it with the starting program on the same inputs.
                Do not re-measure small differences again and again, and run one measurement at a time:
                the machine is shared. Respect the task's limits with a clear margin, especially time.

                Leave in your folder the best version you measured that differs from the starting
                program: an unchanged program adds nothing to the search, while a different one, even
                a weaker one, can still be built on. It must be complete, valid for the task, and
                measured. When you finish, end with a message of at most 10 lines: the idea behind your
                program and why it should win, the starting program's and your program's results on the
                same inputs, what you tried that did not work and why, and what you would try next.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          # job_output / job_kill: the shell tool moves commands that outlive
          # their timeout into background jobs, which these tools read and stop.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
